# Dhara MCP Server Configuration

server_name: "dhara"

storage:
  path: ~/.local/share/dhara/production.dhara
  read_only: false
  backend: file

# AsyncSqliteStorage reads from this key, not storage.path. The hardcoded
# fallback ("/dev/shm/dhara.db") is Linux-only and breaks on macOS. Must use
# a distinct .db file (not the SHELF-1 sync-storage file at storage.path).
dhara:
  storage:
    sqlite:
      url: sqlite+aiosqlite:////Users/les/.local/share/dhara/async.db

adapters:
  enable_versioning: true
  enable_health_checks: true
  max_versions_per_adapter: 10
  auto_push_on_startup: true

authentication:
  enabled: false
  method: token
  required_scopes: []
  token:
    tokens_file: null
    require_auth: true
    default_role: readonly

backups:
  enabled: false
  directory: ./backups
