# Dhara Standard Mode Configuration
# Full-featured production mode with configurable storage

mode: standard
server_name: "Dhara (Production)"

# Storage configuration (configurable backend)
# XDG Base Directory compliant: uses ~/.local/share by default.
# Resolves to /Users/les/.local/share/dhara/production.dhara on a stock macOS box.
# NOTE: Dhara's path resolver only calls .expanduser() (no expandvars), so we
# must use the `~` form rather than ${HOME}.
storage:
  path: ~/.local/share/dhara/production.dhara
  backend: file  # Options: file, sqlite, s3, gcs, azure
  read_only: false

# AsyncSqliteStorage reads from this key, not storage.path. The hardcoded
# fallback ("/dev/shm/dhara.db") is Linux-only and breaks on macOS. Must use
# a distinct .db file (not the SHELF-1 sync-storage file at storage.path).
dhara:
  storage:
    sqlite:
      url: sqlite+aiosqlite:////Users/les/.local/share/dhara/async.db

# Server configuration (all interfaces for production)
host: 0.0.0.0
port: 8683

# Adapter distribution configuration
adapters:
  enable_versioning: true
  enable_health_checks: true
  max_versions_per_adapter: 10
  auto_push_on_startup: true

# Logging configuration (production format)
logging:
  level: INFO
  format: json

# Cloud storage (enabled in standard mode)
cloud_storage:
  enabled: true
  provider: s3  # Options: s3, gcs, azure
  bucket: dhara-production
  prefix: backups/
  # Backup schedule (cron format)
  schedule: "0 2 * * *"  # Daily at 2 AM

authentication:
  enabled: false
  method: token
  required_scopes: []
  token:
    tokens_file: /etc/dhara/tokens.json
    require_auth: true
    default_role: readonly

backups:
  enabled: true
  directory: /data/dhara/backups

# Cache configuration
cache:
  size: 100000
  shrink_threshold: 2.0

# S3-specific configuration (when backend=s3)
s3:
  bucket: dhara-production
  region: us-east-1
  prefix: dhara/

# GCS-specific configuration (when backend=gcs)
gcs:
  bucket: dhara-production
  prefix: dhara/

# Azure-specific configuration (when backend=azure)
azure:
  container: dhara-production
  prefix: dhara/
