[build-system]
requires = ["setuptools", "wheel"]

[dependency-groups]
dev = [
    "azure-storage-blob>=12.29.0",
    "boto3>=1.43.20",
    "crackerjack",
    "dill>=0.4.1",
    "google-cloud-storage>=3.10.1",
    # onnxruntime removed — Dhara uses Ollama/OpenAI for embeddings via MCP.
    # No native ONNX inference needed; avoids conflicts with session-buddy.
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "session-buddy>=0.19.9",
]

# Full-Featured Library Template
# For: Libraries, frameworks, shared packages (oneiric, mcp-common, acb, fastblocks)
# Features: Comprehensive testing, quality tools, type checking fallback

[project]
name = "dhara"
version = "0.9.7"
description = "A Python Persistent Object Database with ACID Transactions"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "CNRI and others", email = "nas-dhara@arctrix.com"},
]
maintainers = [
    {name = "dhara Development Team", email = "nas-dhara@arctrix.com"},
]
keywords = ["database", "persistence", "object-database", "storage", "nosql"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # MCP server framework (ecosystem standard)
    "fastmcp>=3.3.1",
    "mcp-common>=0.16.1",
    # Configuration and logging (ecosystem standard)
    "oneiric>=0.13.0",
    # ASGI server for FastMCP
    "uvicorn>=0.48.0",
    # Admin shell with IPython (ecosystem standard)
    "ipython>=9.14.0",
    "rich>=15.0.0",  # For pretty tables and console output
    "cryptography>=48.0.0",
    "msgspec>=0.21.1",
    "dill>=0.4.1",
    "schedule>=1.2.2",
    "zstandard>=0.25.0",
]

[project.optional-dependencies]
cloud = [
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "azure-storage-blob>=12.29.0",
    "boto3>=1.43.20",
    "google-cloud-storage>=3.10.1",
]

[project.urls]
Homepage = "https://github.com/lesleslie/dhara"
Documentation = "https://github.com/lesleslie/dhara#readme"
Repository = "https://github.com/lesleslie/dhara"
"Source Code" = "https://github.com/lesleslie/dhara"
"Bug Tracker" = "https://github.com/lesleslie/dhara/issues"

[project.scripts]
dhara = "dhara.cli:main"

[tool.setuptools]

[tool.setuptools.packages.find]
include = ["dhara*"]
exclude = ["tests*", "test*"]

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = ["tests/", "test_*.py", "*_test.py"]

[tool.ruff.lint]
extend-select = ["C901", "F", "I", "UP"]
ignore = ["E402", "F821"]
fixable = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 600
testpaths = ["test", "tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "security: Security-focused tests",
    "performance: Performance and load tests",
    "slow: Slow tests (>2s)",
    "benchmark: Benchmark tests (deferred)",
    "smoke: Quick smoke tests",
    "regression: Regression tests",
    "api: API endpoint tests",
]

[tool.coverage.run]
branch = true
parallel = true  # CRITICAL for pytest-xdist
concurrency = ["multiprocessing"]
source = ["dhara"]
data_file = ".coverage"
omit = [
    "*/test/*",
    "*/__pycache__/*",
    "*/__init__.py",
    "*/_version.py",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_also = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "pass",
    "raise ImportError",
    "except ImportError",
]

[tool.pyright]
include = ["dhara"]
exclude = [
    "test/*",
    "scratch",
    ".venv",
    "build",
    "dist",
]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.bandit]
target = ["dhara"]
skips = ["B101", "B110", "B112", "B404", "B603", "B607"]
exclude_dirs = ["test/"]

[tool.codespell]
quiet-level = 3
ignore-words-list = "crate,uptodate,nd,nin"
ignore-regex = '(b"help"|b"he")'

[tool.creosote]
paths = ["dhara"]
deps-file = "pyproject.toml"
# These are intentionally declared but not directly imported in dhara/ code:
# - ipython: admin shell with IPython
# - rich: pretty tables and console output
# - uvicorn: ASGI server for FastMCP
exclude-deps = ["ipython", "rich", "uvicorn"]

[tool.refurb]
enable_all = false
quiet = true
python_version = "3.13"

[tool.complexipy]
default_pattern = "**/*.py"
exclude_patterns = [
    "**/test/**",
    "**/test_*.py",
]
max_complexity = 15
